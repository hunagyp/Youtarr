# OVERLAY TEST STACK - Uses official image with modified code mounted
# Avoids Docker build issues in LXC

services:
  youtarr-test:
    image: dialmaster/youtarr:latest
    container_name: youtarr-audio-test
    ports:
      - "3088:3011"
    environment:
      - TZ=Europe/Budapest
      - YOUTARR_UID=1000
      - YOUTARR_GID=1000
      - DB_HOST=youtarr-test-db
      - DB_PORT=3306
      - DB_NAME=youtarr_test
      - DB_USER=youtarr_test
      - DB_PASSWORD=test_password_123
      - AUTH_ENABLED=true
      - AUTH_PRESET_USERNAME=admin
      - AUTH_PRESET_PASSWORD=testtest
      - LOG_LEVEL=debug
    volumes:
      # Mount modified server code over container's /app/server
      - ./server:/app/server
      # Mount modified client build over container's /app/client/build
      - ./client/build:/app/client/build:ro
      # Mount modified migrations
      - ./migrations:/app/migrations:ro
      # Mount modified config example
      - ./config/config.example.json:/app/server/config.example.json:ro
      # Persistent data volumes
      - ./test-config:/app/config
      - ./test-jobs:/app/jobs
      - ./test-images:/app/server/images
      - /data/youtube:/usr/src/app/data
    depends_on:
      youtarr-test-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined

  youtarr-test-db:
    image: mariadb:10.3
    container_name: youtarr-test-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=test_root_123
      - MYSQL_DATABASE=youtarr_test
      - MYSQL_USER=youtarr_test
      - MYSQL_PASSWORD=test_password_123
    volumes:
      - ./test-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
